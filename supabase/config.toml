# Local development settings for `supabase start`. Mirror the auth settings in the
# hosted project (Dashboard > Authentication), which this file does not change.
project_id = "kids-ai-cyber-academy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Room guests arrive in phase 3; until then nobody signs in anonymously.
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.tutor-chat]
verify_jwt = true

[functions.create-family]
verify_jwt = true

[functions.delete-family]
verify_jwt = true
